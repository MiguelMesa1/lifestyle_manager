{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="login-section">

    <div class="login-card">

        <div class="login-header">
            <h1>Iniciar sesión</h1>

            <p>
                Ingresa a tu cuenta para gestionar tus hábitos y seguir tu progreso.
            </p>
        </div>


        <form method="POST" class="login-form">

            {% csrf_token %}

            <!-- Correo -->
            <div class="form-group">
                <label for="email">
                    Correo electrónico
                </label>

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  placeholder="Ingresa tu usuario"
                  required
              >
            </div>


            <!-- Contraseña -->
            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

            </div>


            <!-- Recordarme -->
            <div class="form-check">

                <input
                    type="checkbox"
                    class="form-check-input"
                    id="remember"
                >

                <label
                    class="form-check-label"
                    for="remember"
                >
                    Recordarme
                </label>

            </div>


            <!-- Botón -->

            <button
                type="submit"
                class="login-button"
            >
                Iniciar sesión
            </button>


            <!-- Registro -->

            <p class="login-register">

                ¿No tienes una cuenta?

                <a href="#">
                    Regístrate
                </a>

            </p>

        </form>

    </div>

</section>

{% endblock %}
